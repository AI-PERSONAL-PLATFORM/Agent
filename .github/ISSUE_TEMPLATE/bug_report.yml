name: Bug report (form)
description: The report tracks a bug in the agents service.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: This form records a bug in the agents service in the project backlog.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: The behavior that needs investigation or repair.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Agent or prompt
        - Tool
        - API route
        - Configuration or model provider
        - CI or tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: The smallest set of steps that reproduces the problem.
      placeholder: |
        1. The user starts the agents service ...
        2. The user sends a request to POST /agents/assistant ...
        3. The user observes ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or AG-UI events
      description: Tracebacks, streamed events, or logs. Remove API keys and other secrets first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: MODEL_PROVIDER, model name, OS, Docker and mise tool versions if relevant.
      placeholder: e.g. opencode, gpt-5, Ubuntu 24.04, Docker 27, Python 3.13
